<!doctype html>
<html lang="id" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP5 Penutup — SBS Sirkulatel</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F8FAFC; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #0F172A; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #F8FAFC; }
      .clip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 90px 80px; text-align: center; }
      .kicker { font-size: 44px; font-weight: 700; letter-spacing: 6px; color: #059669; text-transform: uppercase; margin-bottom: 30px; }
      .hero { font-size: 104px; font-weight: 800; line-height: 1.2; color: #0F172A; }
      .hero .green { color: #047857; }
      .steps { margin-top: 60px; display: flex; flex-direction: column; gap: 30px; width: 100%; }
      .step { display: flex; align-items: center; gap: 30px; background: #FFFFFF; border: 3px solid #E2E8F0; border-radius: 28px; padding: 34px 40px; text-align: left; }
      .num { flex: none; width: 110px; height: 110px; border-radius: 999px; background: #059669; color: #FFFFFF; font-size: 64px; font-weight: 800; display: grid; place-items: center; }
      .step p { font-size: 54px; font-weight: 700; line-height: 1.3; }
      .sub { margin-top: 36px; font-size: 56px; line-height: 1.4; color: #334155; }
      .logo { font-size: 120px; font-weight: 800; color: #064E3B; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.37" data-width="1080" data-height="1920">
      <section id="s1" class="clip" data-start="0" data-duration="16.34" data-track-index="1">
        <p class="kicker">Ingat 3 langkahnya</p>
        <div class="steps">
          <div class="step" id="s1-st1"><div class="num">1</div><p>Catat bahan dan resep</p></div>
          <div class="step" id="s1-st2"><div class="num">2</div><p>Coba dulu di <span class="green" style="color:#047857;">simulator</span></p></div>
          <div class="step" id="s1-st3"><div class="num">3</div><p>Masak, jual, lihat laporan</p></div>
        </div>
      </section>

      <section id="s2" class="clip" data-start="16.34" data-duration="7.03" data-track-index="1">
        <h1 id="s2-title" class="hero">Selamat mencoba!</h1>
        <p id="s2-sub" class="sub">Semoga laris, dan untungnya jelas.</p>
        <p id="s2-logo" class="logo" style="margin-top:60px;font-size:84px;">SBS Sirkulatel</p>
      </section>

      <audio id="vo-ep5-s1" data-start="0" data-duration="15.84" src="audio/ep5-s1.mp3"></audio>
      <audio id="vo-ep5-s2" data-start="16.34" data-duration="6.53" src="audio/ep5-s2.mp3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#s1-st1", { x: -80, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.from("#s1-st2", { x: -80, opacity: 0, duration: 0.6, ease: "power3.out" }, 1.0);
      tl.from("#s1-st3", { x: -80, opacity: 0, duration: 0.6, ease: "power3.out" }, 1.6);
      tl.from("#s2-title", { y: 60, opacity: 0, duration: 0.8, ease: "power3.out" }, 16.54);
      tl.from("#s2-sub", { y: 40, opacity: 0, duration: 0.7, ease: "power3.out" }, 17.2);
      tl.from("#s2-logo", { y: 40, opacity: 0, duration: 0.7, ease: "power3.out" }, 17.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
